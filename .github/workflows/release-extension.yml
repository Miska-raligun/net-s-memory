name: Release extension

# Push a tag like v0.2.0 to build the browser extension and publish it as a
# GitHub Release. The tag (minus the "v") becomes the extension version, so
# it must be 1–4 dot-separated integers (a Chrome manifest requirement).
# Can also be run by hand from the Actions tab for an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Derive version from tag
        id: ver
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Tag $TAG must look like v1.2.3 (Chrome extension version rules)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Set package version
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.ver.outputs.version }}"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          grep -q "\"version\": \"$VERSION\"" dist/manifest.json
          NAME="net-s-memory-extension-v$VERSION.zip"
          (cd dist && zip -qr "../$NAME" .)
          sha256sum "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          SUM="$(cut -d' ' -f1 "$NAME.sha256")"
          cat > notes.md <<EOF
          ## 安装（Chrome / Edge 等 Chromium 浏览器）

          1. 下载 \`$NAME\`，解压到一个固定的文件夹（之后不要删除或移动它）。
          2. 打开 \`chrome://extensions\`（Edge：\`edge://extensions\`），开启右上角「开发者模式」。
          3. 点「加载已解压的扩展程序」，选择解压出的文件夹（里面有 \`manifest.json\`）。

          升级：解压新版本覆盖到同一个文件夹，然后在扩展页点「重新加载」，本机存档会保留。

          ## 校验

          \`\`\`
          sha256sum $NAME
          # 应为 $SUM
          \`\`\`

          由 GitHub Actions 从提交 \`${GITHUB_SHA}\` 自动构建，
          构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          使用说明见仓库 README 与 extension/README.md。
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$NAME" "$NAME.sha256" \
              --title "互联网记忆 扩展 $TAG" --notes-file notes.md --verify-tag
          fi
